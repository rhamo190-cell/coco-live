name: Build Android APK
on:
  push:
    branches: [ main, master, رئيسي ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip Source Code
        run: |
          unzip -o coco-live.zip -d ./project_files
          cd project_files
          if [ -d "coco-live" ]; then
            mv coco-live/* ../
          else
            mv * ../
          fi
          cd ..

      - name: Install Expo Tools
        run: |
          npm install -g expo-cli
          npm install

      - name: Build Local APK
        run: |
          npx expo export:local --platform android

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CocoLive-App
          path: ./**/*.apk
